<!DOCTYPE html>
<html lang="fa">
<head>

<title>Paper Bird 5</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#efe3c1;--panel:#f6edd3;--ink:#8a7466;--edge:#a88d78;--shadow:rgba(120,95,70,.25);--ps:1;--po:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2521;--panel:#3a332d;--ink:#d2bfac;--edge:#7d6a5c;--shadow:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#2a2521;--panel:#3a332d;--ink:#d2bfac;--edge:#7d6a5c;--shadow:rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overscroll-behavior:none}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Lato','Vazirmatn',sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{max-width:760px;height:100%;margin:0 auto;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow-y:auto;overscroll-behavior:none}
#screen{position:relative;border:3px solid var(--edge);box-shadow:0 4px 0 var(--shadow);background:#efe3c1;line-height:0;flex:0 0 auto}
canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:4%;background:rgba(239,227,193,.35);cursor:pointer;line-height:1.4}
#overlay.hide{display:none}
#overlay.sheet{align-items:center;justify-content:center;background:rgba(239,227,193,.62);padding:2.5%;cursor:default}
.title{align-self:flex-start;background:rgba(246,237,211,.92);padding:.15em .35em .25em;box-shadow:0 3px 0 rgba(120,95,70,.2)}
.title h1{margin:0;font:900 clamp(26px,9vw,60px)/1 'Lato',sans-serif;color:#a58f80;letter-spacing:.01em;text-shadow:2px 2px 0 rgba(255,255,255,.55)}
.info{align-self:flex-end;max-width:92%;background:rgba(246,237,211,.94);padding:.6em .8em;text-align:right;direction:rtl;color:#7a6556;font:500 clamp(12px,3.4vw,17px)/1.7 'Vazirmatn',sans-serif;box-shadow:0 3px 0 rgba(120,95,70,.2)}
.info p{margin:0}
.info .cta{font-weight:700;color:#5f8a5b;margin-top:.2em}
@media (prefers-reduced-motion:no-preference){.cta{animation:pulse 1.4s steps(2) infinite}}
@keyframes pulse{50%{opacity:.35}}
.sheet-in{background:rgba(246,237,211,.98);border:2px solid #a88d78;padding:.6em .8em;max-height:100%;overflow:auto;width:100%;max-width:560px;direction:rtl;color:#7a6556;font:500 clamp(12px,3.3vw,16px)/1.6 'Vazirmatn',sans-serif;text-align:center;box-shadow:0 4px 0 rgba(120,95,70,.25);-webkit-user-select:text;user-select:text}
.sheet-in h2{margin:0 0 .3em;font:700 1.3em/1.3 'Vazirmatn',sans-serif;color:#6b5648}
.sheet-in h3{margin:.5em 0 .2em;font:700 1em/1.3 'Vazirmatn',sans-serif;color:#8a7466;text-align:right}
.sheet-in p{margin:.2em 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:.2em 0}
.grid.five{grid-template-columns:repeat(3,1fr)}
.card{display:flex;flex-direction:column;align-items:center;gap:1px;border:2px solid #a88d78;background:#f9f2dc;color:#7a6556;padding:.35em .2em;cursor:pointer;font:inherit;border-radius:3px;box-shadow:0 3px 0 rgba(120,95,70,.25)}
.card b{font:900 1.3em/1.2 'Lato',sans-serif}
.card span{font-size:.82em}
.card small{font-size:.78em;opacity:.8}
.card img{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges}
.card.lock{opacity:.4;cursor:not-allowed}
.card.sel{background:#dfeccf;border-color:#6f9a6a;box-shadow:0 3px 0 #6f9a6a}
.card.boss{border-color:#c0645c}
.st{font-style:normal;color:#d9a520;letter-spacing:.08em}
.sb{border:2px solid #a88d78;background:#f3e8c6;color:#6b5648;padding:.35em .9em;margin:.2em .15em;font:700 1em 'Vazirmatn',sans-serif;cursor:pointer;border-radius:3px;box-shadow:0 3px 0 rgba(120,95,70,.25)}
.sb.go{background:#cfe0c4;border-color:#6f9a6a;color:#3f6a3b}
.sb.on{background:#cfe0c4;border-color:#6f9a6a}
.sb:active,.card:active{transform:translateY(2px);box-shadow:none}
.sb:focus-visible,.card:focus-visible{outline:3px solid #6f9a6a;outline-offset:2px}
.big{font:900 2em/1.2 'Lato',sans-serif;color:#d9a520;letter-spacing:.15em}
.kv{display:flex;justify-content:space-between;align-items:center;gap:1em;border-bottom:1px dashed #c9b894;padding:.15em 0}
.kv input[type=range]{flex:1;max-width:60%;accent-color:#6f9a6a}
textarea{width:100%;height:5.5em;font:12px/1.3 monospace;direction:ltr;background:#fffaf0;color:#4d3f35;border:2px solid #a88d78;resize:none;padding:4px}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(246,237,211,.95);color:#7a6556;border:2px solid #a88d78;padding:.25em .8em;font:700 clamp(12px,3.6vw,18px)/1.5 'Vazirmatn','Lato',sans-serif;direction:rtl;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3}
#toast.show{opacity:1}
#bar{display:none;justify-content:flex-end;gap:8px}
.sm{width:44px;height:34px;border:3px solid var(--edge);background:var(--panel);color:var(--ink);font:900 16px/1 'Lato',sans-serif;border-radius:3px;box-shadow:0 3px 0 var(--shadow);cursor:pointer;padding:0}
.sm:active{transform:translateY(2px);box-shadow:none}
.sm:focus-visible,.btn:focus-visible,.tb button:focus-visible{outline:3px solid #6f9a6a;outline-offset:2px}
#pad{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px;touch-action:none;opacity:var(--po)}
#pad.lefty{flex-direction:row-reverse}
#dpad{display:flex;gap:calc(10px*var(--ps));touch-action:none}
#dpad .btn{pointer-events:none}
.acts{display:flex;flex-direction:column;gap:calc(8px*var(--ps));align-items:flex-end}
.row{display:flex;gap:calc(10px*var(--ps))}
.btn{width:calc(66px*var(--ps));height:calc(66px*var(--ps));border:3px solid var(--edge);background:var(--panel);color:var(--ink);font:900 calc(24px*var(--ps))/1 'Lato',sans-serif;border-radius:3px;box-shadow:0 5px 0 var(--shadow);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.sq{height:calc(44px*var(--ps));font-size:calc(13px*var(--ps))}
.btn small{font:500 calc(11px*var(--ps))/1 'Vazirmatn',sans-serif}
.btn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow);background:#e3d6b0;color:#4d3f35}
#edtools{display:none;flex-direction:column;gap:6px}
#edtools.on{display:flex}
.tb{display:flex;gap:6px;overflow-x:auto;padding:0 2px 4px}
.tb button{flex:0 0 auto;min-width:46px;height:38px;padding:0 8px;border:2px solid var(--edge);background:var(--panel);color:var(--ink);font:500 13px/1 'Vazirmatn',sans-serif;border-radius:3px;box-shadow:0 3px 0 var(--shadow);cursor:pointer}
.tb button.sel{background:#e3d6b0;color:#4d3f35;transform:translateY(2px);box-shadow:none}
#archtools{display:none;flex-direction:column;gap:6px}
#archtools.on{display:flex}
.tb button:disabled{opacity:.45}
/* main menu */
.sheet-in.menu{max-width:420px;display:flex;flex-direction:column;gap:6px}
.logo{font:900 clamp(30px,10vw,52px)/1.1 'Lato',sans-serif;color:#a58f80;text-shadow:2px 2px 0 rgba(255,255,255,.6);letter-spacing:.02em;direction:ltr}
.mstat{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;font-size:.82em;opacity:.85}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:0;border:2px solid #a88d78;background:#f9f2dc;color:#6b5648;padding:.45em .3em;cursor:pointer;font:inherit;border-radius:3px;box-shadow:0 3px 0 rgba(120,95,70,.25);text-align:center;line-height:1.35}
.mbtn i{font-style:normal;font-size:1.5em;line-height:1.2}
.mbtn b{font:700 1em 'Vazirmatn',sans-serif}
.mbtn small{font-size:.78em;opacity:.8}
.mbtn.go{background:#cfe0c4;border-color:#6f9a6a;color:#3f6a3b}
.mbtn.big{padding:.7em .4em}
.mbtn.big i{font-size:1.8em}
.mbtn.hot{background:#f4d9c9;border-color:#c0645c;color:#8a3f38}
.mbtn:active{transform:translateY(2px);box-shadow:none}
.mbtn:focus-visible{outline:3px solid #6f9a6a;outline-offset:2px}
.leg{text-align:right}
.leg img{width:28px;height:28px;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;margin-left:8px}
.leg small{max-width:55%;opacity:.8}
.relics{display:grid;grid-template-columns:1fr;gap:6px;margin:.3em 0}
.relics .card{flex-direction:row;justify-content:flex-start;gap:10px;text-align:right;padding:.4em .6em}
.relics .card b{font-size:1.6em}
.relics .card span{font-weight:700;font-size:1em}

#archhud{display:flex;flex-direction:column;gap:2px;direction:rtl;text-align:center;color:var(--ink);font:500 13px/1.5 'Vazirmatn',sans-serif}
.ah{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px 14px}
.ah span{font-weight:700}
.ah.dsc{font-size:12px;opacity:.85}
.pv{display:inline-flex;align-items:center;gap:2px;background:var(--panel);border:2px solid var(--edge);padding:0 5px;border-radius:3px;font-weight:700}
.pv img{width:22px;height:22px;image-rendering:pixelated;image-rendering:crisp-edges}
#aacts button:disabled{opacity:.45}
</style>
</head>

function applyVol(){if(!ac)return;mG.gain.value=settings.mute?0:settings.music*.5;sG.gain.value=settings.mute?0:settings.sfx;}
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    mG=ac.createGain();sG=ac.createGain();mG.connect(ac.destination);sG.connect(ac.destination);
    noiseB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    applyVol();
  }catch(e){ac=null;}
}
function tone(dest,f,t0,d,type,v,slide){
  try{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
    g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.006);g.gain.exponentialRampToValueAtTime(.0008,t0+d);
    o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+d+.03);
  }catch(e){}
}
function hit(dest,t0,d,v,freq,type){
  try{
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=noiseB;f.type=type;f.frequency.value=freq;
    g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+d);
    s.connect(f);f.connect(g);g.connect(dest);s.start(t0);s.stop(t0+d+.02);
  }catch(e){}
}

  const w=rows[0].length,h=rows.length,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const col=pal[r[x]];if(col){g.fillStyle=col;g.fillRect(x,y,1,1);}}});
  return c;
}
function flip(c){
  const f=document.createElement('canvas');f.width=c.width;f.height=c.height;
  const g=f.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f;
}

function buildTerrain(pcol,dcol){
  trees=[];
  terr=document.createElement('canvas');terr.width=gw*T;terr.height=gh*T;
  const g=terr.getContext('2d');
  let lt=-9;
  for(let x=1;x<gw-1;x++){
    if(Math.abs(x-pcol)<1||Math.abs(x-dcol)<1)continue;
    for(let y=0;y<gh;y++){
      const tt=grid[y][x];if(!isLand(tt))continue;
      if(y>0&&isLand(grid[y-1][x]))continue;
      if(nd.has(x+','+y))continue;
      const r=hsh(x,y)%14,bx=x*8+3+hsh(y,x)%3,by=y*8;
      lt=decor(g,x,r,bx,by,lt);
    }
  }
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const tt=grid[y][x];
    if(tt===4){
      g.fillStyle='#c4ae92';g.fillRect(x*8,y*8,8,8);
      g.fillStyle='#8f7766';g.fillRect(x*8,y*8,8,1);g.fillRect(x*8,y*8+7,8,1);g.fillRect(x*8,y*8,1,8);g.fillRect(x*8+7,y*8,1,8);
      g.fillRect(x*8+2,y*8+2,1,1);g.fillRect(x*8+3,y*8+3,1,1);g.fillRect(x*8+4,y*8+3,1,1);g.fillRect(x*8+5,y*8+4,1,1);g.fillRect(x*8+4,y*8+5,1,1);g.fillRect(x*8+2,y*8+5,1,1);
      continue;
    }
    if(!isLand(tt))continue;
    const above=y>0&&isLand(grid[y-1][x]);
    if(tt!==2&&above){g.fillStyle=tt===5?'rgba(140,195,223,.28)':th.earth;g.fillRect(x*8,y*8,8,8);}
    g.fillStyle=tt===5?'#8cc3df':th.line;
    if(!above){g.fillRect(x*8,y*8,8,1);g.globalAlpha=.35;g.fillRect(x*8,y*8+1,8,1);g.globalAlpha=1;if(tt===5){g.fillStyle='#e8f6ff';g.fillRect(x*8+((x*3)%5),y*8,2,1);}}
    g.fillStyle=tt===5?'#8cc3df':th.line;
    const left=x>0?(isLand(grid[y][x-1])||grid[y][x-1]===4):true,right=x<gw-1?(isLand(grid[y][x+1])||grid[y][x+1]===4):true;
    const len=tt!==2?8:3;
    if(!left)g.fillRect(x*8,y*8,1,len);
    if(!right)g.fillRect(x*8+7,y*8,1,len);
    if(tt===1&&above&&y<gh-1&&!isLand(grid[y+1][x])&&grid[y+1][x]!==4){g.globalAlpha=.6;g.fillRect(x*8,y*8+7,8,1);g.globalAlpha=1;}
    if(tt===2&&(y===gh-1||!isLand(grid[y+1][x]))&&hsh(x,y)%3===0){
      g.fillStyle=th.trunk;const bx=x*8+2+hsh(y,x)%4;
      g.fillRect(bx,y*8+1,1,3);g.fillRect(bx+1,y*8+4,1,2);
    }
  }
}
function decor(g,x,r,bx,by,lt){
  const ok=x-lt>4;
  switch(themeI){
    case 0:case 3:
      if(r===0&&ok){addTree(bx,by);return x;}
      if(r===1)flower(g,bx,by);else if(r===2)rock(g,bx,by);else if(r===3||r===4)tuft(g,bx,by);else if(r===5)g.drawImage(sprCurl,bx-4,by-8);
      break;
    case 1:
      if(r===0&&ok){cactus(g,bx,by,r+x);return x;}
      if(r===1&&ok){bare(g,bx,by);return x;}
      if(r===2&&ok){addTree(bx,by);return x;}
      if(r===3)rock(g,bx,by);else if(r===4||r===5)g.drawImage(sprCurl,bx-4,by-8);else if(r===6)tuft(g,bx,by);
      break;
    case 2:
      if((r===0||r===1)&&ok){addTree(bx,by);return x;}
      if(r===2||r===3)rock(g,bx,by);else if(r===4)tuft(g,bx,by);
      break;
    default:
      if(r<=2)crystal(g,bx,by);else if(r===3)rock(g,bx,by);
  }
  return lt;
}

  g.fillStyle=th.trunk;g.fillRect(bx,by+1,1,3);g.fillRect(bx-1,by+4,1,2);g.fillRect(bx+1,by+4,1,2);
}
function bare(g,bx,by){

  g.fillRect(bx,by+1,1,3);g.fillRect(bx-1,by+4,1,2);g.fillRect(bx+1,by+4,1,2);g.fillRect(bx-2,by+6,1,2);
}
function flower(g,bx,by){g.fillStyle=th.line;g.fillRect(bx,by-4,1,4);g.fillStyle=th.flower;g.fillRect(bx-1,by-6,3,1);g.fillRect(bx,by-7,1,3);}

function tuft(g,bx,by){g.fillStyle=th.line;g.fillRect(bx-1,by-2,1,2);g.fillRect(bx+1,by-3,1,3);g.fillRect(bx+3,by-2,1,2);}
function crystal(g,bx,by){g.fillStyle=th.leaf;g.fillRect(bx,by-2,3,2);g.fillRect(bx+1,by-6,1,4);g.fillRect(bx-1,by-1,1,1);g.fillStyle='#e3d4f2';g.fillRect(bx+1,by-5,1,1);}
function drawTree(tr,cx,cy){
  const x=tr.bx-cx,y=tr.by-cy;
  if(x<-20||x>W+20||y<-40||y>H+30)return;
  ctx.fillStyle=th.trunk;

function moveX(e,dx){

function pollPad(){
  if(typeof navigator==='undefined'||!navigator.getGamepads)return;
  let g=null;
  try{for(const x of navigator.getGamepads()){if(x&&x.connected){g=x;break;}}}catch(e){return;}
  const prev=Object.assign({},gp);
  gp.left=gp.right=gp.jump=gp.fire=gp.dash=gp.bomb=gp.start=false;
  if(g){
    const b=i=>g.buttons[i]&&g.buttons[i].pressed,a0=g.axes[0]||0;
    gp.left=a0<-.4||b(14);gp.right=a0>.4||b(15);gp.jump=b(0)||b(12);gp.fire=b(2)||b(7);gp.dash=b(1)||b(5);gp.bomb=b(3)||b(4);gp.start=b(9);
    if(gp.jump&&!prev.jump)input.jp=true;

    if(gp.start&&!prev.start)pauseGame();

}

  if(p.ground){p.coy=6;p.djUsed=false;p.canDash=true;}else if(p.coy>0)p.coy--;
  if(p.dashCD>0)p.dashCD--;if(p.bombCD>0)p.bombCD--;if(p.wallLock>0)p.wallLock--;if(p.sq>0)p.sq--;
  if(input.dash){input.dash=false;if(p.dashCD<=0&&p.canDash&&p.dashT<=0){p.dashT=9;p.dashCD=42;p.canDash=false;if(ax)p.face=ax;p.inv=Math.max(p.inv,12);beep(260,.12,'sawtooth',.04,300);vib(15);}}
  if(input.bomb){input.bomb=false;throwBomb();}

  if(p.dashT>0){
    p.dashT--;p.vx=p.face*3.5;p.vy=0;
    p.trail.push({x:p.x,y:p.y,f:p.face});if(p.trail.length>5)p.trail.shift();
  }else{
    if(p.trail.length)p.trail.shift();
    const ice=p.ground&&onIce();
    const acc=p.wallLock>0?.05:(ice?.05:(p.ground?.35:.28));
    p.vx+=(ax*CH.run-p.vx)*acc;
    if(ax&&p.wallLock<=0)p.face=ax;
    p.vy=Math.min(p.vy+CH.grav,4);
    // wall slide
    p.wall=0;
    if(!p.ground&&p.vy>0){
      const ty=Math.floor((p.y+3)/T);
      const tl=isS(tile(Math.floor((p.x-1)/T),ty)),tr=isS(tile(Math.floor((p.x+p.w)/T),ty));
      if(tl&&iL)p.wall=-1;else if(tr&&iR)p.wall=1;
      if(p.wall){p.vy=Math.min(p.vy,1);p.canDash=true;if(t%6===0)parts.push({x:p.x+(p.wall<0?0:6),y:p.y+6,vx:0,vy:.3,life:10,c:th.dust});}
    }
    if(CH.glide&&!p.ground&&p.vy>.9&&iJ&&!p.wall)p.vy=.9;
    // jumps
    if(p.buf>0&&p.coy>0){p.vy=-CH.jv;p.buf=0;p.coy=0;p.sq=0;beep(380,.1,'square',.035,260);for(let i=0;i<3;i++)parts.push({x:p.x+3,y:p.y+7,vx:(Math.random()-.5)*1.2,vy:-Math.random()*.4,life:10,c:th.dust});}
    else if(jpNow&&p.wall){p.vy=-3.4;p.vx=-p.wall*2.1;p.wallLock=10;p.face=-p.wall;p.buf=0;p.wall=0;beep(450,.1,'square',.035,250);}
    else if(jpNow&&p.dj&&!p.djUsed&&p.coy<=0){p.vy=-3.3;p.djUsed=true;p.buf=0;burst(p.x+3,p.y+7,'#ffffff',5);beep(520,.1,'square',.035,300);}
    if(!iJ&&p.vy<-1.2)p.vy*=.7;
  }
  moveX(p,p.vx);
  const vyB=p.vy;
  moveY(p,p.vy);
  if(p.ground&&!p.wasGround){
    if(vyB>1.8){p.sq=6;for(let i=0;i<4;i++)parts.push({x:p.x+3,y:p.y+7,vx:(Math.random()-.5)*1.4,vy:-Math.random()*.6,life:14,c:th.dust});}
  }
  p.wasGround=p.ground;
  if(p.ground&&Math.abs(p.vx)>.9&&t%7===0)parts.push({x:p.x+3,y:p.y+7,vx:-p.face*.3,vy:-.2,life:9,c:th.dust});
  if(p.inv>0)p.inv--;if(p.cd>0)p.cd--;if(p.tri>0)p.tri--;if(p.shield>0)p.shield--;if(p.wt>0&&--p.wt===0){p.wep='';toast('سلاح تموم شد',1000);}
  p.anim+=Math.abs(p.vx)*.2;
  if(iF&&p.cd<=0)shoot();
  // springs
  for(const sp of springs){
    if(sp.t>0)sp.t--;
    if(p.vy>=0&&ov(p,{x:sp.x,y:sp.y-2,w:8,h:6})){p.vy=-5.3;p.ground=false;p.djUsed=false;p.canDash=true;sp.t=12;p.sq=0;beep(300,.2,'square',.05,500);vib(15);}
  }
  if(p.y>gh*T+4){die();return;}

  // ---------- bombs ----------
  for(const b of bombs){
    b.fuse--;b.vy=Math.min(b.vy+.15,3.5);
    b.x+=b.vx;if(isS(tile(Math.floor((b.x+2)/T),Math.floor((b.y+2)/T)))){b.x-=b.vx;b.vx*=-.5;}
    b.y+=b.vy;
    if(b.vy>0&&isS(tile(Math.floor((b.x+2)/T),Math.floor((b.y+4)/T)))||b.vy>0&&tile(Math.floor((b.x+2)/T),Math.floor((b.y+4)/T))===2){b.y=Math.floor((b.y+4)/T)*T-4;b.vy*=-.3;b.vx*=.7;}
    if(b.fuse===0||b.y>gh*T+10)b.boom=true;
  }
  for(const b of bombs)if(b.boom&&b.y<=gh*T+10)explode(b);
  bombs=bombs.filter(b=>b.fuse>0&&!b.boom);

  // ---------- bullets ----------
  for(const b of bullets){
    b.life--;
    if(b.k==='N'){
      let best=null,bd=70;
      for(const e of es){if(e.dead)continue;const d=Math.hypot(e.x+e.w/2-b.x,e.y+e.h/2-b.y);if(d<bd){bd=d;best=e;}}
      if(best){
        const sp=Math.hypot(b.vx,b.vy)||2.4,ax=best.x+best.w/2-b.x,ay=best.y+best.h/2-b.y,m=Math.hypot(ax,ay)||1;
        b.vx+=(ax/m*sp-b.vx)*.14;b.vy+=(ay/m*sp-b.vy)*.14;
        const n=Math.hypot(b.vx,b.vy)||1;b.vx=b.vx/n*sp;b.vy=b.vy/n*sp;
      }
    }
    if(b.k==='X'){
      const nx=b.x+b.vx,ny=b.y+b.vy;
      if(isS(tile(Math.floor((nx+1)/T),Math.floor(b.y/T)))){b.vx=-b.vx;b.bn++;}else b.x=nx;
      if(isS(tile(Math.floor((b.x+1)/T),Math.floor(ny/T)))){b.vy=-b.vy||-.6;b.bn++;}else b.y=ny;
      if(b.bn>3||b.y<-6||b.y>gh*T+6)b.life=0;
    }else{
      b.x+=b.vx;b.y+=b.vy;
      if(isS(tile(Math.floor((b.x+1)/T),Math.floor(b.y/T))))b.life=0;
    }
    const bb={x:b.x,y:b.y,w:3,h:2};
    for(const e of es){
      if(e.dead||b.life<=0)continue;
      if(ov(bb,e)){
        if(e.type==='B'&&!bossVuln(e))continue;
        if(b.k==='W'){if(b.hit.has(e))continue;b.hit.add(e);}else b.life=0;
        beep(300,.05,'square',.03);damageEnemy(e,b.k==='W'?2:1,'shot');
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0);

  // ---------- enemy projectiles ----------
  for(const b of eb){
    b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;b.life--;
    const cx=Math.floor((b.x+b.w/2)/T),cy=Math.floor((b.y+b.h/2)/T);
    if(b.kind==='wave'){if(isS(tile(Math.floor((b.x+(b.vx>0?b.w:0))/T),cy)))b.life=0;}
    else if(isS(tile(cx,cy))||b.x<-8||b.x>gw*T+8||b.y>gh*T+8)b.life=0;
    if(b.life>0&&ov(p,b)){if(p.dashT>0){/* dash through */}else{b.life=0;hurt(b.x);}}
  }
  eb=eb.filter(b=>b.life>0);

  // ---------- enemies ----------
  const dm=dmul();
  for(const e of es){
    if(e.dead)continue;
    if(e.flash>0)e.flash--;
    if(e.type==='b'){
      if(e.life!==undefined&&--e.life<=0){e.dead=true;burst(e.x,e.y,'#f2d52a',4);continue;}
      e.x=e.bx+Math.sin(t*.025*dm+e.ph)*22;
      e.y=e.by+Math.sin(t*.06+e.ph)*3;
    }else if(e.type==='m'){
      e.vy=Math.min(e.vy+.2,4);
      if(e.ground){
        const aheadX=e.dir>0?e.x+e.w+1:e.x-1;
        if(!tile(Math.floor(aheadX/T),Math.floor((e.y+e.h+1)/T)))e.dir*=-1;
      }
      if(moveX(e,e.dir*.3*dm))e.dir*=-1;
      moveY(e,e.vy);
    }else if(e.type==='j'){
      e.vy=Math.min(e.vy+.2,4);
      if(e.ground){
        e.vx=0;e.face=p.x>e.x?1:-1;
        if(--e.cd<=0&&Math.abs(p.x-e.x)<90&&Math.abs(p.y-e.y)<50){e.vy=-3;e.vx=e.face*.9*dm;e.cd=Math.round(70/dm);}
      }
      if(e.vx&&moveX(e,e.vx))e.vx=0;
      moveY(e,e.vy);
    }else if(e.type==='s'){
      e.face=p.x>e.x?1:-1;
      if(e.wind>0){
        if(--e.wind<=0){eb.push({x:e.x+(e.face>0?6:-2),y:e.y+2,vx:e.face*1.1*dm,vy:0,g:0,w:3,h:3,life:140,kind:'stinger'});beep(200,.08,'square',.03,-60);}
      }else if(--e.cd<=0&&Math.abs(p.x-e.x)<110&&Math.abs(p.y-e.y)<48){e.cd=Math.round(110/dm);e.wind=14;}
    }else if(e.type==='z'){
      e.x=e.bx+Math.sin(t*.02+e.ph)*14;e.y=e.by+Math.sin(t*.05+e.ph)*2;
      if(--e.zt<=0){
        if(e.zs===0){e.zs=1;e.zt=Math.round(40/Math.min(dm,1.1));e.bolt=e.x+5;}
        else if(e.zs===1){e.zs=2;e.zt=12;beep(90,.2,'sawtooth',.06,-40);shake=3;}
        else{e.zs=0;e.zt=Math.round(150/dm);}
      }
      if(e.zs>0){
        const col=Math.floor(e.bolt/T);let gy=gh*T;
        for(let y=Math.floor((e.y+6)/T);y<gh;y++){if(isS(tile(col,y))||tile(col,y)===2){gy=y*T;break;}}
        e.boltY=gy;
        if(e.zs===2&&ov(p,{x:e.bolt,y:e.y+6,w:3,h:Math.max(1,gy-(e.y+6))}))hurt(e.bolt);
      }
    }else if(e.type==='B'){
      updBoss(e);
      if(e.dead)continue;
    }
    if(st==='play'&&ov(p,e)){
      if(e.type==='B'){
        if(p.dashT>0){if(e.inv<=0&&bossVuln(e)){damageEnemy(e,1,'dash');e.inv=14;shake=4;}}
        else{
          const stomp=p.vy>0&&(p.y+p.h-e.y)<7&&e.stomp;
          if(stomp){if(e.inv<=0&&bossVuln(e)){damageEnemy(e,2,'stomp');e.inv=25;shake=4;p.vy=-3;beep(200,.1,'square',.05,-80);vib(20);}else p.vy=-2;}
          else if(!e.harm)hurt(e.x+e.w/2);
        }
      }else if(p.dashT>0){damageEnemy(e,2,'dash');}
      else{
        const stomp=p.vy>0&&(p.y+p.h-e.y)<6&&e.type!=='z';
        if(stomp){killEnemy(e,'stomp');p.vy=-2.8;p.djUsed=false;}
        else hurt(e.x+e.w/2);
      }
    }
  }
  es=es.filter(e=>!e.dead);

  // ---------- hazards ----------
  for(const s of spikes)if(ov(p,s)){hurt(s.x+4,-2.8);break;}

  // ---------- items ----------
  for(const it of items){
    if(it.got)continue;
    if(!ov(p,{x:it.x+1,y:it.y+1,w:6,h:6}))continue;
    if(it.type==='c'){it.got=true;coinsGot++;score+=25;pop(it.x,it.y-4,'+25');beep(880+coinsGot*40,.09,'square',.035,300);burst(it.x+4,it.y+4,'#f6d63a',4);}
    else if(it.type==='k'){it.got=true;p.key=true;beep(700,.12,'square',.04,500);toast('کلید رو برداشتی! برو سمت در',1500);}
    else if(it.type==='h'){if(p.hp<p.maxhp){it.got=true;p.hp++;beep(520,.12,'triangle',.06,400);burst(it.x+4,it.y+4,'#e0606f',6);}}
    else if(it.type==='J'){it.got=true;p.dj=true;toast('پرش دوبل!',1300);beep(600,.15,'triangle',.06,400);}
    else if(it.type==='R'){it.got=true;p.tri=900;toast('تیر سه‌تایی!',1300);beep(600,.15,'triangle',.06,400);}
    else if(it.type==='O'){it.got=true;p.shield=1500;toast('سپر فعال شد',1300);beep(600,.15,'triangle',.06,400);}
    else if(WEP[it.type]){it.got=true;p.wep=it.type;p.wt=1500;toast(WEP[it.type].name+'!',1400);beep(600,.15,'triangle',.06,400);burst(it.x+4,it.y+4,'#ffffff',5);}
    else if(it.type==='T'){it.got=true;p.bombs+=3;toast('۳ بمب! (دکمه‌ی بمب)',1500);beep(600,.15,'triangle',.06,400);}
  }
  if(lever&&!lever.on&&ov(p,{x:lever.x,y:lever.y,w:8,h:8})){
    lever.on=true;beep(300,.2,'square',.05,200);toast('دروازه باز شد!',1500);shake=3;
    for(const g of gates){grid[g.y][g.x]=0;burst(g.x*8+4,g.y*8+4,'#a48a76',3);}
  }
  if(hintCD>0)hintCD--;
  if(door&&ov(p,door)){
    if(p.key)completeLevel();
    else if(hintCD<=0){toast(boss?'اول باید باس رو شکست بدی':'اول باید کلید رو پیدا کنی',1400);hintCD=120;}
  }
  updParts();
  const tx=Math.max(0,Math.min(gw*T-W,p.x+3-W/2+p.face*10));
  const ty=Math.max(0,Math.min(gh*T-H,p.y+3-H/2));
  cam.x+=(tx-cam.x)*.1;cam.y+=(ty-cam.y)*.1;
}

/* ================= results ================= */
function completeLevel(){
  const sec=timeF/60,bonus=Math.max(0,Math.round((L.par-sec)*3)),hpB=p.hp*25;
  const total=score+bonus+hpB;
  const allCoins=coinsGot>=coinsTotal;
  const stars=1+(allCoins?1:0)+(allCoins&&sec<=L.par&&deaths===0?1:0);
  jingle([[523,.1],[659,.1],[784,.1],[1047,.3]]);vib([40,30,80]);
  let newBest=false;
  if(typeof cur==='number'){
    const sv=save.lv[cur]||{stars:0,best:0,score:0};
    if(!sv.best||sec<sv.best){sv.best=Math.round(sec*10)/10;newBest=true;}
    sv.stars=Math.max(sv.stars,stars);sv.score=Math.max(sv.score,total);
    save.lv[cur]=sv;
    save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,cur+2));
    persist();
  }
  shake=0;setSt('result');setTrack('menu');
  const last=typeof cur==='number'&&cur>=LEVELS.length-1;
  const wd=typeof cur==='number'&&LEVELS[cur].world!==(LEVELS[cur+1]||{world:-1}).world;
  const star='★'.repeat(stars)+'☆'.repeat(3-stars);
  let btn='';
  if(cur==='custom')btn='<button class="sb go" data-act="edit">ویرایش</button><button class="sb" data-act="play" data-i="custom">دوباره</button>';
  else btn=(last?'':'<button class="sb go" data-act="play" data-i="'+(cur+1)+'">مرحله‌ی بعد</button>')+'<button class="sb" data-act="play" data-i="'+cur+'">دوباره</button><button class="sb" data-act="select">نقشه</button>';
  const head=last?'تموم کردی! تو قهرمان بازی شدی 🎉':(wd?'جهان '+fa(L.world+1)+' تموم شد!':'مرحله تموم شد!');
  setOverlay('<div class="sheet-in"><h2>'+head+'</h2><div class="big">'+star+'</div>'+
    '<div class="kv"><span>سکه</span><b>'+fa(coinsGot)+' از '+fa(coinsTotal)+'</b></div>'+
    '<div class="kv"><span>زمان</span><b>'+fmt(sec)+(newBest&&typeof cur==='number'?' (رکورد جدید!)':'')+'</b></div>'+
    '<div class="kv"><span>امتیاز</span><b>'+fa(total)+'</b></div>'+
    '<p style="font-size:.85em;opacity:.8">۲ ستاره: همه‌ی سکه‌ها · ۳ ستاره: همه‌ی سکه‌ها، زیر '+fmt(L.par)+' و بدون مردن</p>'+btn+'</div>','sheet');
}

/* ================= render ================= */
function panel(x,y,w,h){
  ctx.fillStyle='#a88d78';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#f2e8c8';ctx.fillRect(x+1,y+1,w-2,h-2);
  ctx.fillStyle='#d6c7a0';ctx.fillRect(x+2,y+2,w-4,1);
}
function drawSky(cx){
  const sky=th.sky;
  if(sky==='sun'||sky==='snow'){
    const sx=34,sy=24,r=13;
    ctx.fillStyle=th.sun;
    for(let dy=-r;dy<=r;dy+=2){const hw=Math.floor(Math.sqrt(r*r-dy*dy));ctx.fillRect(sx-hw,sy+dy,hw*2,1);}
    ctx.fillStyle=th.sunD;
    for(let dy=-10;dy<=10;dy+=4){ctx.fillRect(sx-r-7,sy+dy,3,1);ctx.fillRect(sx+r+5,sy+dy,3,1);}
  }else if(sky==='moon'){
    ctx.fillStyle='#ffffff';
    for(let i=0;i<34;i++){const sx=hsh(i,5)%W,sy=hsh(i,9)%70;if(((t>>4)+i)%7)ctx.fillRect(sx,sy,1,1);}
    ctx.fillStyle=th.sun;
    for(let dy=-9;dy<=9;dy++){const hw=Math.floor(Math.sqrt(81-dy*dy));ctx.fillRect(150-hw,24+dy,hw*2,1);}
    ctx.fillStyle=th.bg;
    for(let dy=-8;dy<=8;dy++){const hw=Math.floor(Math.sqrt(64-dy*dy));ctx.fillRect(155-hw,22+dy,hw*2,1);}
  }
  if(sky==='cave'){
    ctx.fillStyle=th.cloud;
    for(let i=0;i<9;i++){
      const x=(((i*29+(hsh(i,3)%12)-cx*.4)%(W+40))+W+40)%(W+40)-20,h=6+hsh(i,7)%10;
      for(let k=0;k<h;k++){const w=Math.max(1,Math.round((h-k)*.55));ctx.fillRect(Math.round(x-w/2),k,w,1);}
    }
  }else{
    const span=W+70;
    for(let i=0;i<5;i++){
      const wx=i*61+(hsh(i,themeI)%20),yy=6+(hsh(themeI,i)%36);
      const x=(((wx-cx*.25)%span)+span)%span-35;
      if(themeI===1)ctx.drawImage(sprCurl,Math.round(x),yy);
      else ctx.drawImage(sprCloud,Math.round(x),yy);
    }
  }
}
function flyerSpr(){return themeI>=3?BAT:(themeI===2?BEEI:BEE);}
// returns draw info {c,x,y,w,h} in world coords for an enemy (used for render + corpses)
function sprOf(e){
  const x=Math.round(e.x),y=Math.round(e.y);
  if(e.type==='b')return{c:flyerSpr()[(t>>2)&1],x:x-1,y:y-1,w:8,h:8};
  if(e.type==='m')return{c:e.dir>0?sprMush:sprMushL,x:x-1,y:y-1,w:8,h:8};
  if(e.type==='j')return{c:e.face>0?FROG:FROGL,x:x-1,y:y-1,w:8,h:8};
  if(e.type==='s')return{c:SHOOT,x:x-1,y:y-1,w:8,h:8};
  if(e.type==='z')return{c:CLOUDE,x,y,w:12,h:6};
  return null;
}
function drawBoss(b,cx,cy){
  if(b.flash>0&&(b.flash&2))return;
  const x=Math.round(b.x-cx),y=Math.round(b.y-cy);
  if(b.kind==='bee'){
    ctx.drawImage(BEE[(t>>2)&1],x,y,16,16);
    ctx.fillStyle='#f6c630';ctx.fillRect(x+4,y-1,8,1);ctx.fillRect(x+4,y-2,1,1);ctx.fillRect(x+7,y-3,2,2);ctx.fillRect(x+11,y-2,1,1);
  }else if(b.kind==='scorp'){
    ctx.drawImage(b.face>0?SCORP:SCORPL,x,y);
    if(b.state==='tele'&&(t>>2)&1){ctx.fillStyle='#d9544f';ctx.fillRect(x+(b.face>0?20:2),y-3,2,2);}
    if(b.stun>0){ctx.fillStyle='#f6e45a';for(let i=0;i<3;i++)ctx.fillRect(x+6+i*5+Math.round(Math.sin(t*.2+i)*2),y-4,2,2);}
  }else if(b.kind==='golem'){
    ctx.drawImage(b.face>0?GOLEM:GOLEML,x,y);
    if(b.state==='slam'&&b.st>14){ctx.fillStyle='#f2fbff';ctx.fillRect(x+1,y+2,2,2);ctx.fillRect(x+13,y+2,2,2);}
  }else if(b.kind==='owl'){
    ctx.globalAlpha=Math.max(.15,b.vis);ctx.drawImage(OWL[(t>>3)&1],x,y);ctx.globalAlpha=1;
  }else if(b.kind==='dragon'){
    ctx.drawImage(DRAGON[(t>>3)&1],x,y);
    if(b.state==='rain'&&((t>>2)&1)){ctx.fillStyle='#f6e45a';ctx.fillRect(x+9,y+10,2,2);}
  }else if(b.kind==='shroom'){
    const sq=b.state==='walk'&&b.st<12?2:0;
    ctx.drawImage(SHROOM,x,y+sq,20,16-sq);
  }
}
function drawEb(b,cx,cy){
  const x=Math.round(b.x-cx),y=Math.round(b.y-cy);
  if(b.kind==='ball'){ctx.fillStyle=themeI===1?'#d97a55':'#f2fbff';ctx.fillRect(x+1,y,b.w-2,b.h);ctx.fillRect(x,y+1,b.w,b.h-2);ctx.fillStyle='#8a7466';ctx.fillRect(x+b.w-2,y+b.h-1,1,1);}

  }

    else if(e.type==='j'&&!e.ground)ctx.drawImage(s.c,x+1,y,s.w-2,s.h+1);
    else ctx.drawImage(s.c,x,y);

      if(e.zs===1&&(t>>2)&1){ctx.fillStyle='rgba(240,207,42,.6)';ctx.fillRect(Math.round(e.bolt-cx),ey+6,1,Math.max(1,e.boltY-e.y-6));}
      if(e.zs===2){
        ctx.fillStyle='#f6e45a';
        const bx=Math.round(e.bolt-cx);let k=0;
        for(let yy=ey+6;yy<e.boltY-cy;yy+=3){ctx.fillRect(bx+((k++&1)?1:0),yy,2,3);}
      }
    }
  }
  // projectiles
  for(const b of bullets){
    const bx=Math.round(b.x-cx),by=Math.round(b.y-cy);
    if(b.k==='W'){ctx.fillStyle='#5fd0e0';ctx.fillRect(b.vx>0?bx-3:bx,by,6,2);ctx.fillStyle='#ffffff';ctx.fillRect(b.vx>0?bx-2:bx+1,by,4,1);}
    else if(b.k==='X'){ctx.fillStyle='#e07aa8';ctx.fillRect(bx,by,2,2);ctx.fillStyle='#ffffff';ctx.fillRect(bx,by,1,1);}
    else if(b.k==='N'){ctx.fillStyle='#f0a030';ctx.fillRect(Math.round(b.x-b.vx*1.5-cx),Math.round(b.y-b.vy*1.5-cy),1,1);ctx.fillStyle='#f6d63a';ctx.fillRect(bx,by,2,2);}
    else if(b.k==='Q'){ctx.fillStyle='#5a5048';ctx.fillRect(bx,by,2,2);}
    else{ctx.fillStyle='#5a5048';ctx.fillRect(bx,by,3,1);}
  }
  for(const b of eb)drawEb(b,cx,cy);
  for(const b of bombs){const x=Math.round(b.x-cx),y=Math.round(b.y-cy);ctx.drawImage(BOMB,x-2,y-2);if((t>>2)&1){ctx.fillStyle='#f6e45a';ctx.fillRect(x+1,y-3,1,1);}}
  for(const f of fx){
    const r=4+f.t*2.2,x=f.x-cx,y=f.y-cy;
    ctx.fillStyle=f.t<5?'#fff3a6':'#f0a030';
    for(let a=0;a<14;a++){const an=a/14*Math.PI*2;ctx.fillRect(Math.round(x+Math.cos(an)*r),Math.round(y+Math.sin(an)*r),2,2);}
    if(f.t<4)ctx.fillRect(Math.round(x-3),Math.round(y-3),6,6);
  }
  drawPlayer(cx,cy);
  for(const q of parts){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x-cx),Math.round(q.y-cy),1,1);}
  // ambient
  for(const a of amb){
    if(themeI===3){if(Math.sin(t*.06+a.ph)<0)continue;ctx.fillStyle=th.amb;ctx.fillRect(Math.round(a.x),Math.round(a.y),1,1);}
    else if(themeI===2){ctx.fillStyle=th.amb;ctx.fillRect(Math.round(a.x),Math.round(a.y),a.ph>3?2:1,a.ph>3?2:1);}
    else{ctx.fillStyle=th.amb;ctx.fillRect(Math.round(a.x),Math.round(a.y),2,1);}
  }
  ctx.restore();
  for(const o of pops)txt(o.s,Math.round(o.x-cx),Math.round(o.y-cy),'#7a6556');
  hud();
  if(wipe>0){
    ctx.fillStyle=th.bg2;const n=12,sw=W/n;
    for(let i=0;i<n;i++){const w=Math.ceil(sw*Math.min(1,wipe*1.3-(i/n)*.3));if(w>0)ctx.fillRect(Math.round(i*sw),0,w,H);}
  }
}

/* ================= editor ================= */
const ENT_OK='PDkchbmjszSJROTYWXNQ';
let ed=null;
function newEd(){
  const cells=Array.from({length:14},()=>new Uint8Array(48));
  for(let x=0;x<48;x++){cells[12][x]=1;cells[13][x]=1;}
  return {w:48,h:14,theme:0,cells,ents:[['P',2,11],['D',45,11]],tool:'1',cam:0,dirty:true};
}
function edToLevel(){
  return {name:'مرحله‌ی من',world:0,par:90,theme:ed.theme,w:ed.w,h:ed.h,cells:ed.cells.map(r=>Array.from(r).join('')),ents:ed.ents.map(e=>e.slice())};
}
function encodeLevel(){
  const rows=ed.cells.map(r=>Array.from(r).join('')).join('');
  const rle=[];let i=0;
  while(i<rows.length){let j=i;while(j<rows.length&&rows[j]===rows[i])j++;rle.push(rows[i]+(j-i));i=j;}
  const o={v:1,w:ed.w,h:ed.h,t:ed.theme,g:rle.join(','),e:ed.ents};
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function decodeLevel(code){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(String(code).trim()))));
    const w=o.w|0,h=o.h|0,th_=o.t|0;
    if(w<16||w>120||h<14||h>40||th_<0||th_>5||typeof o.g!=='string'||!Array.isArray(o.e)||o.e.length>400)return null;
    let s='';
    for(const part of o.g.split(',')){
      const ch=part[0],n=parseInt(part.slice(1),10);
      if(!'012345'.includes(ch)||!(n>0)||s.length+n>w*h)return null;
      s+=ch.repeat(n);
    }
    if(s.length!==w*h)return null;
    const cells=Array.from({length:h},(_,y)=>{const r=new Uint8Array(w);for(let x=0;x<w;x++)r[x]=s.charCodeAt(y*w+x)-48;return r;});
    const ents=[];
    for(const e of o.e){
      if(!Array.isArray(e)||typeof e[0]!=='string'||!ENT_OK.includes(e[0]))return null;
      const x=e[1]|0,y=e[2]|0;
      if(x<0||x>=w||y<0||y>=h)return null;
      ents.push(e[0]==='S'?[e[0],x,y,Math.max(1,Math.min(8,e[3]|0))]:[e[0],x,y]);
    }
    return {w,h,theme:th_,cells,ents,tool:'1',cam:0,dirty:true};
  }catch(err){return null;}
}
function saveCustom(){try{localStorage.setItem(CUSTOM_KEY,encodeLevel());}catch(e){}}
function enterEditor(){
  if(!ed){
    let loaded=null;
    try{const c=localStorage.getItem(CUSTOM_KEY);if(c)loaded=decodeLevel(c);}catch(e){}
    ed=loaded||newEd();
  }
  ed.dirty=true;
  hideOverlay();setSt('edit');setTrack('menu');
  applyTheme(ed.theme);
  syncTools();
  toast('روی صفحه بکش تا بسازی',1800);
}
function syncTools(){document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('sel',b.dataset.t===ed.tool));}
function applyTool(tx,ty,drag){
  if(tx<0||ty<0||tx>=ed.w||ty>=ed.h)return;
  const tool=ed.tool;
  if(tool==='e'){
    ed.cells[ty][tx]=0;
    ed.ents=ed.ents.filter(e=>!(e[1]===tx&&(e[2]===ty||(e[0]==='D'&&e[2]===ty+1))));
    ed.dirty=true;
  }else if('1245'.includes(tool)){
    ed.cells[ty][tx]=+tool;ed.dirty=true;
  }else if(!drag){
    if(tool==='P'||tool==='D')ed.ents=ed.ents.filter(e=>e[0]!==tool);
    else ed.ents=ed.ents.filter(e=>!(e[1]===tx&&e[2]===ty));
    ed.ents.push(tool==='S'?[tool,tx,ty,1]:[tool,tx,ty]);
  }
}

    else if(e[0]==='z')ctx.drawImage(CLOUDE,x,y+1);
    else if(e[0]==='Y'){ctx.fillStyle='#8a7466';ctx.fillRect(x,y+6,8,2);ctx.fillStyle='#e0606f';ctx.fillRect(x+1,y+4,6,2);}
    else if(e[0]==='S'){ctx.fillStyle='#8a7466';for(let k=0;k<2;k++){ctx.fillRect(x+k*4+1,y+4,2,2);ctx.fillRect(x+k*4,y+6,4,2);}}
    else if(ORB[e[0]])ctx.drawImage(ORB[e[0]],x,y);
  }
  const sw=Math.round(W*W/(ed.w*8));
  ctx.fillStyle='#a88d78';ctx.fillRect(Math.round(cx/(ed.w*8)*W),H-2,sw,2);
}
function edPointer(e,drag){

function drawHeroBody(h,cx){
  const o=PLS[h.ch],spr=!h.ground?o.J:(((h.anim>>3)&1)?o.B:o.A);
  const x=Math.round(h.x-cx)-1,y=Math.round(h.y)-1;
  ctx.drawImage(spr,x,y,h.w+2,h.h+1);
  if(h.shield>0){ctx.fillStyle='#5fb3a8';ctx.fillRect(x-1,y,1,h.h+1);ctx.fillRect(x+h.w+2,y,1,h.h+1);}
  if(h.hp<h.maxhp){const bw=h.w+2;ctx.fillStyle='#5a5048';ctx.fillRect(x,y-3,bw,1);ctx.fillStyle='#e0606f';ctx.fillRect(x,y-3,Math.max(1,Math.round(bw*h.hp/h.maxhp)),1);}
}
function renderArch(){
  const cx=Math.round(ar.cam);
  ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));
  drawSky(cx);
  ctx.drawImage(terr,-cx,0);
  for(const tr of trees)drawTree(tr,cx,0);
  // door
  const dx=ar.A.door*8-cx,dy=ar.doorY;
  ctx.fillStyle='#8f7766';ctx.fillRect(dx,dy,8,16);ctx.fillStyle='#cdb894';ctx.fillRect(dx+1,dy+1,6,15);
  ctx.fillStyle='#f0cf2a';ctx.fillRect(dx+5,dy+9,1,2);
  // build grid hint
  if(ar.phase==='build'){
    ctx.fillStyle='rgba(120,95,70,.10)';
    for(let x=0;x<=ar.A.w;x++)if(x*8-cx>=0&&x*8-cx<=W)ctx.fillRect(x*8-cx,0,1,H);
    ctx.fillStyle='rgba(217,84,79,.14)';
    ctx.fillRect(-cx,0,32,H);ctx.fillRect((ar.A.w-4)*8-cx,0,32,H);
  }
  // traps
  for(const q of ar.traps){
    const x=Math.round((q.k==='M'?q.x:q.tx*8)-cx),y=q.ty*8;
    if(x<-12||x>W+4)continue;
    if(q.k==='S'){ctx.fillStyle='#8a7466';for(let k=0;k<2;k++){ctx.fillRect(x+k*4+1,y+4,2,2);ctx.fillRect(x+k*4,y+6,4,2);}ctx.fillStyle='#b9a590';ctx.fillRect(x+1,y+4,1,3);ctx.fillRect(x+5,y+4,1,3);}
    else if(q.k==='M')ctx.drawImage(q.dir>0?sprMush:sprMushL,x-1,y);
    else if(q.k==='T')ctx.drawImage(SHOOT,x,y);
    else if(q.k==='B'){ctx.drawImage(BOMB,x,y);if((t>>3)&1){ctx.fillStyle='#d9544f';ctx.fillRect(x+3,y+4,1,1);}}
    else if(q.k==='W'){ctx.fillStyle='#8f7766';ctx.fillRect(x,y,8,8);ctx.fillStyle='#b99f84';ctx.fillRect(x+1,y+1,6,6);ctx.fillStyle='#8f7766';ctx.fillRect(x+1,y+4,6,1);ctx.fillRect(x+4,y+1,1,3);ctx.fillRect(x+2,y+5,1,2);}
    else if(q.k==='G'){ctx.fillStyle='#7aa874';ctx.fillRect(x,y+5,8,3);ctx.fillRect(x+1,y+4,6,1);ctx.fillStyle='#b8dca8';ctx.fillRect(x+2,y+5,1,1);ctx.fillRect(x+5,y+6,1,1);if(((t>>4)+q.tx)&1)ctx.fillRect(x+4,y+3,1,1);}
    else if(q.k==='C'){
      const by=y-Math.round(q.off);
      ctx.fillStyle='#a48a76';ctx.fillRect(x+3,0,2,Math.max(0,by));
      const jx=q.s===1?((t>>1)&1?1:-1):0;
      ctx.fillStyle='#6f6258';ctx.fillRect(x+jx,by,8,8);ctx.fillStyle='#8a7a6c';ctx.fillRect(x+1+jx,by+1,6,4);
      ctx.fillStyle='#d9d2c4';ctx.fillRect(x+jx,by+7,1,1);ctx.fillRect(x+2+jx,by+7,1,1);ctx.fillRect(x+4+jx,by+7,1,1);ctx.fillRect(x+6+jx,by+7,1,1);
    }
    const lv=q.lv||1;
    if(lv>1){ctx.fillStyle='#f6d63a';for(let i=0;i<lv-1;i++)ctx.fillRect(x+1+i*3,y-(q.k==='C'?Math.round(q.off)+2:2),2,2);}
    if((q.k==='M'||q.k==='T'||q.k==='W')&&q.hp<q.maxhp){ctx.fillStyle='#d9544f';ctx.fillRect(x,y-2,Math.max(1,Math.round(8*q.hp/q.maxhp)),1);}
  }
  // holes marker
  // heroes
  for(const h of ar.heroes){
    if(h.inv>0&&((t>>2)&1))continue;
    drawHeroBody(h,cx);
  }
  for(const b of ar.ebs){ctx.fillStyle='#d9544f';ctx.fillRect(Math.round(b.x-cx),Math.round(b.y),3,2);}
  for(const f of fx){ctx.fillStyle='#f0a030';const r=f.t*2;ctx.fillRect(Math.round(f.x-cx-r),Math.round(f.y-1),r*2,2);ctx.fillRect(Math.round(f.x-cx-1),Math.round(f.y-r),2,r*2);}
  for(const q of parts){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x-cx),Math.round(q.y),1,1);}
  ctx.restore();
  for(const o of pops)txt(o.s,Math.round(o.x-cx),Math.round(o.y),'#7a6556');
  // wave progress
  if(ar.phase==='wave'&&ar.count){
    panel(70,2,52,7);ctx.fillStyle='#d6c7a0';ctx.fillRect(72,4,48,3);
    const done=ar.spawned-ar.heroes.length;
    ctx.fillStyle='#6f9a6a';ctx.fillRect(72,4,Math.round(48*Math.max(0,Math.min(1,done/ar.count))),3);
  }
  ctx.drawImage(DRAGON[(t>>4)&1],W-23,2);
  const sw=Math.round(W*W/(ar.A.w*8));
  ctx.fillStyle='#a88d78';ctx.fillRect(Math.round(cx/(ar.A.w*8)*W),H-2,sw,2);
  if(wipe>0){ctx.fillStyle=th.bg2;const n=12,sw2=W/n;for(let i=0;i<n;i++){const w=Math.ceil(sw2*Math.min(1,wipe*1.3-(i/n)*.3));if(w>0)ctx.fillRect(Math.round(i*sw2),0,w,H);}}
}

const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyX:'fire',KeyK:'fire',KeyC:'dash',ShiftLeft:'dash',KeyB:'bomb',KeyV:'bomb'};
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'))return;
  if((e.code==='Enter'||e.code==='Space')&&st==='title'){e.preventDefault();initAudio();setTrack('menu');showMain();setSt('select');return;}
  if(e.code==='KeyM'&&st!=='edit'){settings.mute=!settings.mute;persist();applyVol();toast(settings.mute?'صدا خاموش':'صدا روشن',900);return;}
  if(e.code==='KeyR'&&(st==='play'||st==='pause'||st==='dead')&&!e.repeat){startLevel(cur);return;}
  if(e.code==='KeyP'||e.code==='Escape'){if(st==='play'||st==='pause'){pauseGame();return;}}
  if(st==='edit'){
    if(e.code==='ArrowLeft'){ed.cam=Math.max(0,ed.cam-16);e.preventDefault();}
    if(e.code==='ArrowRight'){ed.cam=Math.min(Math.max(0,ed.w*8-W),ed.cam+16);e.preventDefault();}
    return;
  }
  if(st==='arch'){
    if(!ar)return;
    if(e.code==='ArrowLeft'){ar.cam=Math.max(0,ar.cam-16);e.preventDefault();}
    else if(e.code==='ArrowRight'){ar.cam=Math.min(ar.A.w*8-W,ar.cam+16);e.preventDefault();}
    else if(e.code==='Enter'){e.preventDefault();startWave();}
    return;
  }
  const k=KMAP[e.code];
  if(!k)return;
  e.preventDefault();initAudio();
  if(k==='jump'){if(!input.jump)input.jp=true;input.jump=true;}
  else if(k==='dash'){if(!e.repeat)input.dash=true;}
  else if(k==='bomb'){if(!e.repeat)input.bomb=true;}
  else input[k]=true;
});
